[package]
name = "backbone-app"
version = "0.7.0"
edition = "2021"
description = "Minimal Backbone application skeleton — runnable starting point for any Backbone-based service"
authors = ["Farid Hidayat"]
# An application is never published to crates.io; only library modules are.
# Its license is decided per application, so the skeleton sets none.
publish = false

[[bin]]
name = "backbone-app"
path = "src/main.rs"

[dependencies]
backbone-auth          = { version = "3.0.0", features = ["axum"] }
backbone-authorization = { version = "3.0.0" }
backbone-cache         = { version = "3.0.0" }
backbone-core          = { version = "3.0.0" }
backbone-email         = { version = "3.0.0" }
backbone-graphql       = { version = "3.0.0" }
backbone-health        = { version = "3.0.0", features = ["cli"] }
backbone-jobs          = { version = "3.0.0" }
backbone-maintenance   = { version = "3.0.0" }
backbone-messaging     = { version = "3.0.0" }
backbone-observability = { version = "3.0.0", features = ["prometheus-metrics", "otel-tracing", "middleware", "audit"] }
backbone-orm           = { version = "3.0.0" }
# Outbox relay + the multi_tenant company-RLS fence (ADR-0011).
backbone-outbox        = { version = "3.0.0", features = ["multi_tenant", "runner"] }
backbone-queue         = { version = "3.0.0" }
backbone-rate-limit    = { version = "3.0.0", features = ["redis"] }
backbone-search        = { version = "3.0.0" }
backbone-storage       = { version = "3.0.0" }

# Domain modules composed into this app, from crates.io like the framework.
backbone-asset = "0.6.0"          # fixed-asset register + GL-backed lifecycle (mounted with a real GlPostSink)
backbone-accounting = "0.10.0"     # the ledger the asset lifecycle posts to

# External dependencies — versions match what monorepo-backbone uses today.
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
tower-cookies = "0.10"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }

tracing = "0.1"
tracing-subscriber = "0.3"

anyhow = "1.0"
thiserror = "1.0"

config = "0.14"
dotenvy = "0.15"

uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }

async-trait = "0.1"
mime = "0.3"
reqwest = { version = "0.11", features = ["json"] }
jsonwebtoken = "9"
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
tempfile = "3.0"

# To build against an unreleased framework or module change, add an untracked
# .cargo/config.toml with a [patch.crates-io] entry pointing at a local checkout.
# Never commit a [patch] section: a generated app has no sibling checkouts.

# Dependencies carry line tables only in dev builds. A composed service links many
# crates nobody steps through, and their full DWARF dominates link-time memory and
# the build cache; line tables keep file and line in every backtrace frame, and the
# service's own code keeps the default debug info.
[profile.dev.package."*"]
debug = "line-tables-only"
