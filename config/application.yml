# Backbone Framework Application Configuration (skeleton defaults)
#
# Override any value via environment variable using the `${VAR:default}` syntax.
# Per-environment overrides go in `config/application-{APP_ENV}.yml` (e.g.
# config/application-dev.yml). The skeleton ships with a `dev` overlay.

server:
  host: "${HOST:0.0.0.0}"
  port: 8080

database:
  url: "${DATABASE_URL:postgresql://postgres:password@localhost:5432/backbone_app}"
  max_connections: 20
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800
  # Outbox relay (opt-in, ADR-0011). Point RELAY_DATABASE_URL at the `metaphor_relay` role created by
  # scripts/rls_app_role.sql, and list the producer schemas to fence + drain. Empty ⇒ outbox inactive.
  relay_url: "${RELAY_DATABASE_URL:}"
  # OWNER/admin connection for startup schema-DDL (module migrations + outbox migrate). Set this to a
  # superuser/owner URL when the runtime `url` is the least-privilege `metaphor_app` role, so the app
  # can still apply owner-level DDL at boot. Empty ⇒ startup DDL runs on the runtime `url` (dev).
  admin_url: "${ADMIN_DATABASE_URL:}"
  outbox_schemas: []

logging:
  level: "${LOG_LEVEL:info}"
  format: "${LOG_FORMAT:json}"

security:
  jwt_secret: "${JWT_SECRET:change-me-in-production}"
  jwt_algorithm: "HS256"
  jwt_issuer: "backbone-framework"
  jwt_audience: "backbone-users"
  jwt_expiration: 86400
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
