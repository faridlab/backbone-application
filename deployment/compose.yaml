# Single-host beta stack for backbone-app.
#
# This is the PROD/UAT stack. Local dev uses deployment/compose.dev.yaml.
#
# Networks:
#   edge          — caddy-facing; only services Caddy reverse-proxies to.
#   backend       — private; service + postgres + redis + minio.
#   observability — private; monitoring stack.
#
# Conventions:
#   - Image tags pinned via ${*_TAG} in .env.prod (git SHA or release tag).
#     Never use moving tags (`latest`, `beta`) — rollback by flipping the value.
#   - No host ports on data stores. All inter-container traffic stays on
#     private networks.
#   - restart: unless-stopped everywhere so `reboot` brings the stack back.

# Project name. Without this, docker compose defaults to the directory it
# was invoked from (`deployment-`).
name: backbone-app

services:
  # ───── Data stores ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    # Tuned for a 16 GB single-host deployment shared with redis, minio,
    # the service, and the full observability stack. Retune when postgres
    # moves to its own box.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?must be set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set in .env.prod (long random string)}
      POSTGRES_DB: ${POSTGRES_DB:?must be set in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    # Bind 5432 to localhost ONLY. Internet-unreachable (UFW + 127.0.0.1
    # binding); only accessible via SSH tunnel from a laptop. Required for
    # DBeaver / psql / metaphor-migration access.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Valkey: the BSD-3 Linux Foundation fork of Redis 7.2, wire-compatible with
    # Redis clients (REDIS_URL and the `redis` crate keep working). Redis 7.4+
    # images are RSALv2/SSPL, which is not an open source license.
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # Object storage. The service keeps the name `minio` as a role name so
    # Caddy, backups, chaos experiments and the MINIO_* env contract stay
    # unchanged; the server is RustFS (Apache-2.0, S3- and `mc admin`-
    # compatible). MinIO Community stopped publishing images in Oct 2025 and
    # its repository is archived, so it no longer receives security fixes.
    image: rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    restart: unless-stopped
    command: ["server", "--console-enable", "/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?must be set in .env.prod}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?must be set in .env.prod (long random string)}
    volumes:
      - miniodata:/data
    networks: [backend, edge]
    ports:
      # Console bound to localhost only — SSH-tunnel to reach it.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-shot object-storage bootstrap: `backbone-app storage-init`
  # (backbone_bucket::provision), the same image and pattern as `migrations`.
  # Runs once per `up` and exits 0. It creates the private and public buckets,
  # gives the public one anonymous read, and creates the least-privilege
  # service user (MINIO_ACCESS_KEY / MINIO_SECRET_KEY from ../.env.prod) with
  # the `app-svc` policy on those two buckets only. Idempotent; a changed
  # MINIO_SECRET_KEY rotates the user's key on the next run. The root keys
  # live in this job only, never in the service.
  minio-init:
    image: ghcr.io/${GHCR_OWNER:?must be set in .env.prod (GitHub org/user that owns the GHCR image)}/backbone-app:${SERVICE_TAG:?SERVICE_TAG must be pinned in .env.prod (e.g. v0.5.2 from CI)}
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../.env.prod
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:?must be set in .env.prod}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:?must be set in .env.prod}
      MINIO_SERVICE_POLICY: app-svc
    networks: [backend]
    command: ["storage-init"]
    restart: "no"

  # ───── App ─────────────────────────────────────────────────────────────
  # Migrations (one-shot). Runs `backbone-app migrate` before the main service
  # starts. backbone-app's main binary additionally enforces a MIGRATIONS_STRICT
  # startup gate so it refuses to serve traffic against an unmigrated schema.
  migrations:
    image: ghcr.io/${GHCR_OWNER:?must be set in .env.prod (GitHub org/user that owns the GHCR image)}/backbone-app:${SERVICE_TAG:?SERVICE_TAG must be pinned in .env.prod (e.g. v0.5.2 from CI)}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
      - ../.env.prod
    environment:
      APP_ENV: prod
      # Config loader picks the overlay by RUST_ENV (not APP_ENV) — keep both
      # in sync. Without RUST_ENV, application-prod.yml is silently skipped.
      RUST_ENV: prod
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Outbox relay role (ADR-0011) — same DB, NOBYPASSRLS login created by scripts/rls_app_role.sql.
      RELAY_DATABASE_URL: postgresql://${RELAY_POSTGRES_USER}:${RELAY_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks: [backend]
    command: ["migrate"]
    restart: "no"

  backbone-app:
    image: ghcr.io/${GHCR_OWNER}/backbone-app:${SERVICE_TAG:?SERVICE_TAG must be pinned in .env.prod (e.g. v0.5.2 from CI)}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      # Two-layer env (order matters — later file overrides on conflict):
      #   1. .env.prod                  ← orchestration (this dir)
      #   2. ../.env.prod               ← service-owned runtime
      - .env.prod
      - ../.env.prod
    environment:
      APP_ENV: prod
      RUST_ENV: prod
      HOST: 0.0.0.0
      PORT: "8080"
      METRICS_ENABLED: "true"
      METRICS_PORT: "9090"
      # Caddy terminates TLS and reverse-proxies to this container; trust
      # the X-Forwarded-For / X-Real-IP headers it sets so audit logs and
      # per-IP login throttle see the real client IP, not Caddy's.
      TRUST_PROXY_HEADERS: "true"
      # Belt-and-braces with the `migrations` one-shot above. Refuses to
      # start if any migration is pending.
      MIGRATIONS_STRICT: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Outbox relay role (ADR-0011) — same DB, NOBYPASSRLS login created by scripts/rls_app_role.sql.
      RELAY_DATABASE_URL: postgresql://${RELAY_POSTGRES_USER}:${RELAY_POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://s3.${DOMAIN:?must be set in .env.prod (apex domain, e.g. example.com)}
    networks: [edge, backend, observability]
    healthcheck:
      test: ["CMD", "/app/backbone-app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ───── Edge ────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    depends_on:
      - backbone-app
      - minio
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?must be set in .env.prod (Let's Encrypt notification email)}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  # ───── Monitoring ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [observability]

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [observability]

  # Ships every container's stdout/stderr to Loki. Grafana Alloy replaces
  # Promtail, which reached end of life on 2026-03-02; the labels (container,
  # service, stream) are the same, so Loki queries and alerts are unchanged.
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [observability]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?must be set in .env.prod (Grafana login password)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${SMTP_HOST:-}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${EMAIL_FROM:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks: [edge, observability]

  cadvisor:
    # Releases from v0.53.0 on are published to ghcr.io only.
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [observability]

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks: [backend, observability]

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.17@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    restart: unless-stopped
    volumes:
      - uptimekuma_data:/app/data
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  uptimekuma_data:

networks:
  edge:
  backend:
  observability:
