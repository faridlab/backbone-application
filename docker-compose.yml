# Backbone Framework Development Environment
# Monolith orchestrator with supporting services

version: '3.8'

services:
  # Main Backbone Application
  backbone:
    build:
      context: ../..
      dockerfile: apps/backbone/Dockerfile
    ports:
      - "3001:3001"       # HTTP API
      - "50051:50051"     # gRPC API
      - "9090:9090"       # Prometheus metrics
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://root:password@postgres:5432/backbonedb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-key-not-for-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173
      - LOG_LEVEL=debug
      - LOG_FORMAT=pretty
    volumes:
      - ./config:/app/config
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backbone-network
    restart: unless-stopped
    command: cargo run --bin backbone

  # PostgreSQL 16, as in deployment/. A dev volume created by PostgreSQL 15 will not
  # start on 16: remove it (`docker compose down -v`) or dump and restore first.
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=backbonedb
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - backbone-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d backbonedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey for caching and sessions: the BSD-3 Linux Foundation fork of
  # Redis 7.2, wire-compatible with Redis clients (REDIS_URL keeps working).
  # Redis 7.4+ images are RSALv2/SSPL, which is not an open source license.
  redis:
    image: valkey/valkey:9.0.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    networks:
      - backbone-network
    restart: unless-stopped

  # Mailpit for email testing (development; MIT, maintained successor to MailHog)
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - backbone-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - backbone-network
    restart: unless-stopped

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - backbone-network
    restart: unless-stopped
    profiles:
      - monitoring

  # S3-compatible storage (development). Service name `minio` is kept as a
  # role name; the server is RustFS (Apache-2.0, S3- and `mc admin`-compatible)
  # because MinIO Community no longer publishes images or security fixes.
  minio:
    image: rustfs/rustfs:1.0.2
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
    volumes:
      - minio_data:/data
    command: ["server", "--console-enable", "/data"]
    networks:
      - backbone-network
    restart: unless-stopped
    profiles:
      - storage

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  minio_data:

networks:
  backbone-network:
    driver: bridge